<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" href = "{{ url_for('static', filename='style.css')}}">
        <title>Homepage</title>
    </head>
    <body>
        
        {% for post in posts %}
        <form method = "POST" action="{{url_for('home')}}">
        <input type = "hidden" name="post_id" value = "{{ loop.index0 }}">
        <button name="action" type="submit" value="like" >like</button>
        <input type="text" name="comment" placeholder="Write a Comment">
        <button name="action" type="submit" value="comment">comment</button> 
        <button name="action" type="submit" value="edit">edit</button>
        <button name="action" type="submit" value="delete">delete</button>
            <h3>Post:</h3>
            <p>{{post.username}}</p>
            <p>"{{post.post}}"</p>
            <h3>Analytics:</h3>
            <p><b>Amount of likes:</b></p>
            <p>{{post.likes}}</p>
            <p><b>Comments:</b></p>
            {% for comment in post.comments %}
            <p> {{comment.username}}: "{{comment.comment}}"</p>
            {%endfor%}
                
       </form>{%endfor%}

    </body>
</html>
