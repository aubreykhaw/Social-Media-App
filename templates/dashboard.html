<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" href = "{{ url_for('static', filename='style.css')}}">
        <title>Homepage</title>
    </head>
    <body>
        
        {% for post in posts %}
        <form method = "POST" action="{{url_for('home')}}"
        <input type = "hidden" name="post_id" value = "{{ loop.index0 }}">
        <button name="action" type="submit" value="like" >like</button>
        <button name="action" type="submit" value="comment">comment</button>
        <button name="action" type="submit" value="edit">edit</button>
        <button name="action" type="submit" value="delete">delete</button>
            <p>{{post.username}}</p>
            <p>{{post.post}}</p>
            <p>{{post.likes}}</p>
            <p>{{post.comments}}</p>
       </form>{%endfor%}

    </body>
</html>
